name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write # Required for uploading release assets

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          dir=release-${{ matrix.name }}
          mkdir -p "$dir" dist
          cp README.md LICENSE CHANGELOG.md "$dir"/
          [ -f SUPPORT.md ] && cp SUPPORT.md "$dir"/
          cp -r examples "$dir"/
          bin=target/${{ matrix.target }}/release/aether-renderer-core
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "$dir"/
          archive=aether-renderer-core-${{ github.ref_name }}-${{ matrix.name }}.zip
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/$archive" "$dir"/*
          else
            zip -r "dist/$archive" "$dir"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
